name: pastoral-reports-prod

services:
  # ============================================
  # Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastoral-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@pg:5432/${DB_NAME}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set TRUSTED_PROXY_CIDRS to the proxy range in front of the app}
      JWT_ISSUER: ${JWT_ISSUER:-amgreports}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-amgreports-web}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-10m}
      REFRESH_TTL: ${REFRESH_TTL:-24h}
      REFRESH_IDLE_TTL: ${REFRESH_IDLE_TTL:-30m}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pastoral-net

  # ============================================
  # Database
  # ============================================
  pg:
    image: postgres:15.3-alpine
    container_name: pastoral-prod-pg
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5435}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pastoral-net

volumes:
  pg_data:
    driver: local

networks:
  pastoral-net:
    driver: bridge
