        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Ends the sign-in the refresh_token cookie belongs to and clears
        both cookies. It needs no valid access token, so it works after that has expired.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's ID, name, email, role and permissions,
        read live from the database. Use it to show or hide actions; the server still
        enforces every permission.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.MeResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Trades the refresh_token cookie for a new access token and a new
        refresh token, both set as cookies. The old refresh token stops working. Answers
        401 and clears the cookies when the refresh token is unknown, expired, idle
        too long, revoked, or its account may no longer sign in. A token that was
        rotated within the last 10 seconds (a second tab) is a 401 that leaves the
        cookies alone.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh the sign-in
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Resets the user''s password using a valid reset token. The new
        password follows the same rules as change-password: strong enough (422 on
        new_password) and at most 72 bytes. confirm_password is required and must
        equal new_password exactly (422 on confirm_password), checked before the token.'
      parameters:
      - description: Reset payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password with token
      tags:
      - auth
  /auth/verify-email:
    get:
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email with token
      tags:
      - auth
  /health:
    get:
      description: Returns OK if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /live:
    get:
      description: Returns OK if the process is alive
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - system
  /ready:
    get:
      description: Returns OK if the DB is connected
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - system
  /reports:
    get:
      description: Returns a page of reports, newest first. Without reports:read_any
        the list is limited to the caller's own reports.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Limit (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Month name, case-insensitive
        in: query
        name: month
        type: string
      - description: Year
        in: query
        name: year
        type: integer
      - description: Partial, case-insensitive match
        in: query
        name: worker
        type: string
      - description: Partial, case-insensitive match on area assignment
        in: query
        name: area
        type: string
      - description: Partial, case-insensitive match on church name
        in: query
        name: church
        type: string
      - description: 'Status: pending, approved or needs_revision'
        in: query
        name: status
        type: string
      - description: Only reports resubmitted after a revision request, any status
        in: query
        name: revised
        type: boolean
      - description: Only the authenticated user's reports
        in: query
        name: mine
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_pkg_pagination.Response-github_com_ssr0016_pastoral-reports_backend_internal_model_ReportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List reports
      tags:
      - reports
    post:
      consumes:
      - application/json
      description: Creates a monthly report for the current user as Pending.
      parameters:
      - description: Report payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.CreateReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create report
      tags:
      - reports
  /reports/{id}:
    delete:
      description: Soft-deletes a report. Without reports:delete_any only the caller's
        own report can be deleted.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete report
      tags:
      - reports
    get:
      description: Returns one report. Without reports:read_any only the caller's
        own report is visible; another user's report is 404.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get report
      tags:
      - reports
    put:
      consumes:
      - application/json
      description: Replaces the report's fields and its whole metric set. A missing
        year keeps the current year. Without reports:write_any only the caller's own
        report can be updated.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: integer
      - description: Report payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UpdateReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update report
      tags:
      - reports
  /reports/{id}/complete:
    patch:
      description: Approves an open report or marks an approved report as needing
        revision. Requires reports:approve. Returns metadata only, never report text.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional admin note
        in: body
        name: body
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.StatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportMetadata'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Approve or unapprove report
      tags:
      - reports
  /reports/{id}/revision:
    patch:
      description: Marks a report as needing revision. Requires reports:approve and
        returns metadata only.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional admin note
        in: body
        name: body
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.StatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportMetadata'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Request report revision
      tags:
      - reports
  /reports/current:
    get:
      description: Returns the authenticated user's report for the current filing
        period.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get current report
      tags:
      - reports
  /users:
    get:
      description: Needs users:list. Returns paginated list of users
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Limit (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Filter by email
        in: query
        name: email
        type: string
      - description: Filter by role ID
        in: query
        name: role_id
        type: integer
      - description: Filter by status; all or empty means every status. deleted returns
          only deleted users; every other value leaves them out
        enum:
        - all
        - active
        - inactive
        - disciplinary
        - deceased
        - deleted
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_pkg_pagination.Response-github_com_ssr0016_pastoral-reports_backend_internal_model_UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List users
      tags:
      - users
  /users/{id}:
    get:
      description: Needs users:list. Returns a single user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get user by ID
      tags:
      - users
  /users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Replaces the signed-in user's avatar. JPEG, PNG or WebP, at most
        512 pixels per side; the whole request is capped at 1 MiB (413 above it),
        so the client should downscale first.
      parameters:
      - description: Image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Upload my profile picture
      tags:
      - users
securityDefinitions:
  CookieAuth:
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
