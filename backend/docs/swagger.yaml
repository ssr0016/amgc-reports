info:
  contact: {}
  description: 'Pastoral Reports backend API: JWT cookie auth and RBAC'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Pastoral Reports API
  version: "1.0"
paths:
  /admin/analytics/attendance:
    get:
      description: Weekly metric totals for the selected year period and by church.
        Defaults to approved reports; status=all includes pending, needs_revision,
        and approved reports. compare=true includes the same period from the previous
        year. Needs tracker:read.
      parameters:
      - description: Year
        in: query
        name: year
        required: true
        type: integer
      - description: Metric key
        in: query
        name: metric
        required: true
        type: string
      - description: approved or all; defaults to approved
        in: query
        name: status
        type: string
      - description: full_year, q1, q2, q3, q4, or a lowercase month; defaults to
          full_year
        in: query
        name: period
        type: string
      - description: Include the previous year's same period
        in: query
        name: compare
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_stats.AttendanceAnalytics'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Annual attendance analytics
      tags:
      - admin/analytics
  /admin/analytics/attendance/excel:
    get:
      description: The same query and data as GET /admin/analytics/attendance, as
        a formatted .xlsx with Summary, Weekly Trend, Church Breakdown and All Metrics
        sheets. Needs tracker:read. Writes no audit row. Rate limited with the other
        Excel downloads, 5 per minute per user.
      parameters:
      - description: Year
        in: query
        name: year
        required: true
        type: integer
      - description: Metric key
        in: query
        name: metric
        required: true
        type: string
      - description: approved or all; defaults to approved
        in: query
        name: status
        type: string
      - description: full_year, q1, q2, q3, q4, or a lowercase month; defaults to
          full_year
        in: query
        name: period
        type: string
      - description: Include the previous year's same period
        in: query
        name: compare
        type: boolean
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Annual attendance analytics as Excel
      tags:
      - admin/analytics
  /admin/audit-logs:
    get:
      description: 'Needs audit:read. One page of the audit trail for one month in
        Asia/Manila, newest first, with the total. Optionally one action. Read-only:
        no endpoint changes or deletes a row. The IP address is never returned (D-A4).
        Details hold only the allow-listed keys of each action, never a password,
        token or report text.'
      parameters:
      - description: Month name, case-insensitive
        in: query
        name: month
        required: true
        type: string
      - description: Year, 2000 to 2100
        in: query
        name: year
        required: true
        type: integer
      - description: One audit action, e.g. LOGIN_FAILED
        in: query
        name: action
        type: string
      - default: 1
        description: Page, from 1
        in: query
        name: page
        type: integer
      - default: 50
        description: Rows per page, at most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_pkg_pagination.Response-github_com_ssr0016_pastoral-reports_backend_internal_model_AuditLogResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Audit log
      tags:
      - admin/audit
  /admin/permissions:
    get:
      parameters:
      - description: Filter by resource
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse'
            type: array
      security:
      - CookieAuth: []
      summary: List all permissions
      tags:
      - admin/permissions
    post:
      consumes:
      - application/json
      parameters:
      - description: Permission payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse'
      security:
      - CookieAuth: []
      summary: Create a new permission
      tags:
      - admin/permissions
  /admin/permissions/{id}:
    delete:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Delete a permission
      tags:
