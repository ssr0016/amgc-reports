basePath: /api/v1
definitions:
  github_com_ssr0016_pastoral-reports_backend_internal_model.AssignPermissionRequest:
    properties:
      permission_id:
        type: integer
    required:
    - permission_id
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.ChangeRoleRequest:
    properties:
      role_id:
        type: integer
    required:
    - role_id
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.CreateReportRequest:
    properties:
      area_assignment:
        maxLength: 150
        type: string
      challenges:
        maxLength: 10000
        type: string
      church_name:
        maxLength: 150
        type: string
      metrics:
        additionalProperties:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.MetricWeeks'
        type: object
      month:
        enum:
        - January
        - February
        - March
        - April
        - May
        - June
        - July
        - August
        - September
        - October
        - November
        - December
        type: string
      names:
        maxLength: 5000
        type: string
      narrative_report:
        maxLength: 10000
        type: string
      prayer_request:
        maxLength: 10000
        type: string
      worker:
        maxLength: 150
        type: string
      year:
        maximum: 2100
        minimum: 2000
        type: integer
    required:
    - month
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.CreateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.CreateUserRequest:
    properties:
      area_assignment:
        maxLength: 150
        type: string
      church_name:
        maxLength: 150
        type: string
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        type: string
      role_id:
        type: integer
    required:
    - email
    - name
    - password
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.MeResponse:
    properties:
      area_assignment:
        description: Report form defaults; empty when the admin has not set them.
        type: string
      church_name:
        type: string
      email:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      user_id:
        type: integer
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.MetricWeeks:
    properties:
      week1:
        type: number
      week2:
        type: number
      week3:
        type: number
      week4:
        type: number
      week5:
        type: number
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse:
    properties:
      action:
        type: string
      id:
        type: integer
      name:
        type: string
      resource:
        type: string
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.ReportMetadata:
    properties:
      completed:
        type: boolean
      completed_at:
        type: string
      completed_by:
        type: integer
      id:
        type: integer
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.ReportResponse:
    properties:
      area_assignment:
        type: string
      challenges:
        type: string
      church_name:
        type: string
      completed:
        type: boolean
      completed_at:
        type: string
      completed_by:
        type: integer
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      metrics:
        additionalProperties:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.MetricWeeks'
        type: object
      month:
        type: string
      names:
        type: string
      narrative_report:
        type: string
      prayer_request:
        type: string
      updated_at:
        type: string
      worker:
        type: string
      year:
        type: integer
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.RoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse'
        type: array
      updated_at:
        type: string
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.UpdateReportRequest:
    properties:
      area_assignment:
        maxLength: 150
        type: string
      challenges:
        maxLength: 10000
        type: string
      church_name:
        maxLength: 150
        type: string
      metrics:
        additionalProperties:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.MetricWeeks'
        type: object
      month:
        enum:
        - January
        - February
        - March
        - April
        - May
        - June
        - July
        - August
        - September
        - October
        - November
        - December
        type: string
      names:
        maxLength: 5000
        type: string
      narrative_report:
        maxLength: 10000
        type: string
      prayer_request:
        maxLength: 10000
        type: string
      worker:
        maxLength: 150
        type: string
      year:
        maximum: 2100
        minimum: 2000
        type: integer
    required:
    - month
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.UpdateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.UpdateUserRequest:
    properties:
      area_assignment:
        maxLength: 150
        type: string
      church_name:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse:
    properties:
      area_assignment:
        type: string
      church_name:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      email_verified_at:
        type: string
      id:
        type: integer
      name:
        type: string
      role_id:
        type: integer
    type: object
  github_com_ssr0016_pastoral-reports_backend_pkg_pagination.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  ? github_com_ssr0016_pastoral-reports_backend_pkg_pagination.Response-github_com_ssr0016_pastoral-reports_backend_internal_model_ReportResponse
  : properties:
      data:
        items:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ReportResponse'
        type: array
      meta:
        $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_pkg_pagination.Meta'
    type: object
  internal_handler.CSRFTokenResponse:
    properties:
      csrf_token:
        type: string
    type: object
  internal_handler.CreatePermissionRequest:
    properties:
      action:
        maxLength: 50
        minLength: 2
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      resource:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - action
    - name
    - resource
    type: object
  internal_handler.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_handler.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
info:
  contact: {}
  description: 'Pastoral Reports backend API: session auth and RBAC'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Pastoral Reports API
  version: "1.0"
paths:
  /admin/permissions:
    get:
      parameters:
      - description: Filter by resource
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse'
            type: array
      security:
      - CookieAuth: []
      summary: List all permissions
      tags:
      - admin/permissions
    post:
      consumes:
      - application/json
      parameters:
      - description: Permission payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse'
      security:
      - CookieAuth: []
      summary: Create a new permission
      tags:
      - admin/permissions
  /admin/permissions/{id}:
    delete:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Delete a permission
      tags:
      - admin/permissions
    get:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.PermissionResponse'
      security:
      - CookieAuth: []
      summary: Get permission by ID
      tags:
      - admin/permissions
  /admin/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.RoleResponse'
            type: array
      security:
      - CookieAuth: []
      summary: List all roles
      tags:
      - admin/roles
    post:
      consumes:
      - application/json
      parameters:
      - description: Role payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.RoleResponse'
      security:
      - CookieAuth: []
      summary: Create a new role
      tags:
      - admin/roles
  /admin/roles/{id}:
    delete:
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Delete a role
      tags:
      - admin/roles
    get:
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.RoleResponse'
      security:
      - CookieAuth: []
      summary: Get role by ID
      tags:
      - admin/roles
    put:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.RoleResponse'
      security:
      - CookieAuth: []
      summary: Update a role
      tags:
      - admin/roles
  /admin/roles/{id}/permissions:
    post:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.AssignPermissionRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Assign a permission to a role
      tags:
      - admin/roles
  /admin/roles/{id}/permissions/{pid}:
    delete:
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission ID
        in: path
        name: pid
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Revoke a permission from a role
      tags:
      - admin/roles
  /admin/users:
    post:
      consumes:
      - application/json
      description: 'Admin only. Creates an account with an optional role (default:
        user) and the profile text that prefills the report form. This is the only
        way to create an account.'
      parameters:
      - description: New account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create a user
      tags:
      - admin/users
  /admin/users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
      security:
      - CookieAuth: []
      summary: Get user with role
      tags:
      - admin/users
    put:
      consumes:
      - application/json
      description: Admin only. Replaces the name and the area and church text. The
        password and role are not changed here.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Name and profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update a user's name and profile
      tags:
      - admin/users
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role change payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ChangeRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
      security:
      - CookieAuth: []
      summary: Change a user's role
      tags:
      - admin/users
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the signed-in user's password. The current password is
        checked against the same failure counter as login (5 wrong attempts lock the
        account for 15 minutes). The user's other sessions end; this one stays and
        its token is renewed. A wrong current password is a 422 on current_password,
        not a 401, so the client does not read it as a lost session.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Change own password
      tags:
      - auth
  /auth/csrf:
    get:
      description: Returns the CSRF token for the current client. The same value is
        set in the HttpOnly csrf_token cookie; send it back in the X-CSRF-Token header
        on POST/PUT/DELETE requests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.CSRFTokenResponse'
      summary: Get CSRF token
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset token to the email if it exists
      parameters:
      - description: Email payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and creates a session
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Destroys the current session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's ID, name, email, role and permissions,
        read live from the database. Use it to show or hide actions; the server still
        enforces every permission.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ssr0016_pastoral-reports_backend_internal_model.MeResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the user's password using a valid reset token
      parameters:
      - description: Reset payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password with token
      tags:
      - auth
  /auth/verify-email:
    get:
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email with token
      tags:
      - auth
  /health:
    get:
      description: Returns OK if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /live:
    get:
      description: Returns OK if the process is alive
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - system
  /ready:
    get:
      description: Returns OK if the DB is connected
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - system
  /reports:
    get:
      description: Returns a page of reports, newest first. Without reports:read_any
        the list is limited to the caller's own reports.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Limit (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Month name, case-insensitive
        in: query
